name: Obelisk
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: $(NATIVE_ARCH_ACTUAL)
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Obelisk:
    type: application
    platform: macOS
    sources:
      - path: Obelisk
        excludes:
          - "Bridge/Generated/*.h"
          - "Bridge/Generated/*.modulemap"
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Games launched by Obelisk can use your microphone for in-game voice chat."
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/Obelisk.entitlements
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Obelisk/Bridge/Generated"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Obelisk/Bridge/Generated"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../build/rust/$(CONFIGURATION)"
        OTHER_LDFLAGS: "$(inherited) -lobelisk_bridge -framework Security -framework SystemConfiguration -liconv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    preBuildScripts:
      - name: Build Rust and generate Swift bindings
        script: '"$SRCROOT/../../scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
      - name: Build and sign native Steam helper
        script: '"$SRCROOT/../../scripts/build-steam-native.sh"'
        basedOnDependencyAnalysis: false
  ObeliskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ObeliskTests
    dependencies:
      - target: Obelisk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zagrios.obelisk.tests
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Obelisk/Bridge/Generated"
schemes:
  Obelisk:
    build:
      targets:
        Obelisk: all
    test:
      targets:
        - ObeliskTests
