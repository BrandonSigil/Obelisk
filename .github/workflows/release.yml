# Pushing a tag vX.Y.Z builds Obelisk, signs it with the Developer ID,
# notarizes the DMG and attaches it to a draft release of that tag, which is
# published by hand once its notes are written.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple silicon with Xcode 27 on macOS 27; the Steam host only builds for arm64.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      TEAM_ID: FGW3Z8B82D
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against the app version
        run: |
          VERSION="$(sed -n 's/^MARKETING_VERSION = //p' apps/macos/Config/App.xcconfig)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in App.xcconfig."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/obelisk-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Install the Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/steam-native-target
          key: cargo-release-${{ hashFiles('Cargo.lock', 'crates/steam-native/Cargo.lock') }}
          restore-keys: cargo-release-

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          read -r -a SEARCH_LIST <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN" "${SEARCH_LIST[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf 'DEVELOPMENT_TEAM = %s\n' "$TEAM_ID" > apps/macos/Config/Signing.local.xcconfig

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          OBELISK_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          OBELISK_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          export OBELISK_NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$OBELISK_NOTARY_KEY"
          scripts/build-dmg.sh

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Obelisk $VERSION" --generate-notes \
            build/dist/Obelisk-"$VERSION"-*.dmg build/dist/Obelisk-"$VERSION"-*.dmg.sha256

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" apps/macos/Config/Signing.local.xcconfig
